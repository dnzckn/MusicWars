# Deploy the game to GitHub Pages on every push to master.
#
# Why a workflow and not a gh-pages branch of built files: the built bundle is
# ~1 MB of minified JavaScript that changes on every commit, and a branch of it
# is a second history nobody reads. The workflow builds from source on the
# runner and hands `dist/` to Pages; the repository stays source only.
#
# One-time setting if the first run reports "Get Pages site failed": in the
# repository's Settings → Pages, set Source to "GitHub Actions". The
# `enablement: true` below asks the token to do that itself and works on
# public repositories.
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The typecheck is part of `npm run build`; a red tree does not deploy.
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
