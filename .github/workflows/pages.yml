# Publish the game to GitHub Pages on every push to master.
#
# THE SITE IS SERVED FROM THE `gh-pages` BRANCH, and the reason is measured:
# the first version of this workflow used the "GitHub Actions" Pages source
# (`configure-pages` + `deploy-pages`), which needs the repository's Pages
# source set by hand in Settings → Pages, and the workflow's own token is not
# allowed to create the site — two runs failed at exactly that step. Pushing a
# `gh-pages` branch instead switched Pages on by itself (`has_pages` false →
# true within a minute of the push, the site answering 200), which is the
# behaviour GitHub has kept for that branch name since the beginning. So the
# runner builds from source and force-pushes `dist/` onto `gh-pages` as a
# single orphan commit: the branch is a build artefact, not a history, and
# nobody reads it.
#
# `npm run build` runs the typecheck first, so a red tree does not publish.
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist to gh-pages
        run: |
          set -e
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pages: built from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
